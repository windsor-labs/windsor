<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windsor — Test en mantenimiento</title>
    <meta name="description" content="Estamos mejorando el test vocacional. Vuelve pronto." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* =========================================================
           WINDSOR — MANTENIMIENTO CON SPINNER INFINITO
        ========================================================== */
        :root {
            --black: #0a0a0c;
            --cream: #f3f4f2;
            --white: #ffffff;
            --blue: #006dff;
            --blue-dark: #0050c2;
            --green: #31e083;
            --line: rgba(0,0,0,0.18);
            --sans: "Montserrat", "Helvetica Neue", Arial, sans-serif;
            --body: "Open Sans", "Helvetica Neue", Arial, sans-serif;
            --serif: var(--sans);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* Elimina esquinas redondeadas de contenedores y botones */
        }
        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }
        body {
            background: var(--cream);
            color: var(--black);
            font-family: var(--body);
            overflow-x: hidden;
            min-width: 320px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a {
            color: inherit;
            text-decoration: none;
        }
        h1, h2, h3, h4, .logo, .logo-symbol, .logo-name {
            font-family: var(--sans);
        }
        h1, h2, h3, h4 {
            font-weight: 800;
        }
        em {
            font-style: normal;
        }

        /* Header fijo */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 82px;
            padding: 0 4vw;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 500;
            color: var(--white);
            background: rgba(8, 8, 8, 0.86);
            backdrop-filter: blur(15px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.16em;
        }
        .logo-symbol {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1px solid currentColor;
            font-family: var(--serif);
            font-size: 20px;
        }

        /* Contenido principal */
        .maintenance {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 130px 6vw 80px;
            text-align: center;
        }
        .maintenance-content {
            max-width: 700px;
        }

        /* Spinner giratorio infinito */
        .spinner {
            width: 70px;
            height: 70px;
            margin: 0 auto 35px;
            border: 5px solid var(--line);
            border-top: 5px solid var(--blue);
            border-radius: 50% !important; /* Forzamos que sea un círculo perfecto para girar */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .maintenance h1 {
            font-size: clamp(2.8rem, 5.5vw, 4.2rem);
            line-height: 0.9;
            letter-spacing: -0.06em;
            margin-bottom: 20px;
        }
        .maintenance h1 em {
            display: block;
            color: var(--blue);
            font-family: var(--sans);
            font-weight: 900;
            text-decoration: underline;
            text-decoration-thickness: 0.07em;
            text-underline-offset: 0.1em;
        }
        .maintenance p {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .maintenance p strong {
            color: var(--black);
            font-weight: 700;
        }

        /* Botón sin esquinas redondeadas */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 14px 28px;
            background: var(--blue);
            color: var(--white);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: background 0.25s, transform 0.25s;
        }
        .btn:hover {
            background: var(--blue-dark);
            transform: translateX(6px);
        }
        .btn .arrow-icon {
            display: inline-flex;
            align-items: center;
        }

        /* Footer */
        .footer {
            padding: 35px 6vw;
            background: var(--black);
            color: var(--white);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 40px;
        }
        .footer-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.15em;
        }
        .footer-logo small {
            display: block;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 7px;
            letter-spacing: 0.12em;
        }
        .footer-links {
            display: flex;
            gap: 25px;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .footer-links a {
            opacity: 0.6;
            transition: opacity 0.25s;
        }
        .footer-links a:hover {
            opacity: 1;
        }
        .footer-tagline {
            justify-self: end;
            color: var(--green);
            font-family: var(--serif);
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .footer {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .footer-tagline {
                justify-self: start;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.001ms !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER FIJO -->
    <header class="header">
        <a href="index.html" class="logo">
            <span class="logo-symbol">W</span>
            <span class="logo-name">WINDSOR</span>
        </a>
    </header>

    <!-- CONTENIDO PRINCIPAL CON SPINNER -->
    <main class="maintenance">
        <div class="maintenance-content">
            <!-- Círculo giratorio infinito -->
            <div class="spinner" aria-label="Cargando, página en mantenimiento"></div>

            <h1>
                Pagina en
                <em>mantenimiento</em>
            </h1>
            <p>
                Estamos mejorando el test vocacional para ofrecerte una mejor experiencia.
                <br />
                <strong>Volvemos muy pronto.</strong>
            </p>
            <a href="index.html" class="btn">
                Ir a la página principal
                <span class="arrow-icon" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="7" y1="17" x2="17" y2="7" />
                        <polyline points="7 7 17 7 17 17" />
                    </svg>
                </span>
            </a>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-logo">
            <span class="logo-symbol">W</span>
            <span>WINDSOR <small>LABORATORIO DIGITAL INDEPENDIENTE</small></span>
        </div>
        <div class="footer-links">
            <a href="index.html">Inicio</a>
            <a href="orientacion-vocacional.html">Orientación</a>
        </div>
        <div class="footer-tagline">Precisión aplicada.</div>
    </footer>

</body>
</html>
