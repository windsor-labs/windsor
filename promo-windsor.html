<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windsor — Precisión aplicada</title>
    <meta name="description" content="Windsor es un laboratorio digital independiente. Precisión aplicada en cada proyecto." />
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
    <style>
        /* =========================================================
           WINDSOR PROMO — ESTILOS COMPLETOS (autónomo)
        ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0c;
            color: #ffffff;
        }

        /* Contenedor principal (capa de video) */
        .promo-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Video de fondo */
        .promo-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* Si no hay video, usamos un gradiente animado como fallback */
        .promo-fallback {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0a0a0c 0%, #001a33 50%, #0a0a0c 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Overlay oscuro para legibilidad */
        .promo-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(10, 10, 12, 0.55);
            backdrop-filter: blur(2px);
        }

        /* Contenido centrado */
        .promo-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
            padding: 2rem;
            animation: fadeIn 1.8s ease-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Logo / símbolo */
        .promo-logo {
            display: inline-block;
            font-size: 4.5rem;
            font-weight: 900;
            color: #006dff;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 60px rgba(0, 109, 255, 0.25);
        }

        .promo-logo span {
            display: inline-block;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .promo-tagline {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-block;
            padding: 0.6rem 1.2rem;
        }

        .promo-title {
            font-size: clamp(2.8rem, 10vw, 6.5rem);
            font-weight: 900;
            line-height: 0.92;
            letter-spacing: -0.04em;
            margin: 0.5rem 0 0.8rem;
        }

        .promo-title em {
            display: block;
            color: #31e083;
            font-style: normal;
            text-decoration: underline;
            text-decoration-thickness: 0.08em;
            text-underline-offset: 0.12em;
        }

        .promo-desc {
            font-family: 'Open Sans', sans-serif;
            font-size: clamp(1rem, 1.5vw, 1.3rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.75);
            max-width: 600px;
            margin: 1.5rem auto 2.5rem;
            line-height: 1.7;
            letter-spacing: 0.02em;
        }

        /* Botón CTA */
        .promo-btn {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 16px 36px;
            background: #006dff;
            color: #ffffff;
            border: none;
            border-radius: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 109, 255, 0.2);
        }

        .promo-btn:hover {
            background: #31e083;
            color: #0a0a0c;
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(49, 224, 131, 0.3);
        }

        .promo-btn .arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .promo-btn:hover .arrow {
            transform: translateX(6px);
        }

        /* Indicador de scroll (opcional, decorativo) */
        .promo-scroll {
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            animation: bounceDown 2.2s ease-in-out infinite;
        }

        .promo-scroll .line {
            width: 1px;
            height: 30px;
            background: rgba(255, 255, 255, 0.15);
        }

        @keyframes bounceDown {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(8px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .promo-logo { font-size: 3.2rem; }
            .promo-tagline { font-size: 0.8rem; letter-spacing: 0.2em; padding: 0.4rem 0.8rem; }
            .promo-title { font-size: 2.6rem; }
            .promo-desc { font-size: 0.95rem; }
            .promo-btn { padding: 14px 24px; font-size: 0.75rem; }
            .promo-scroll { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .promo-fallback { animation: none; }
            .promo-content { animation: none; }
            .promo-scroll { animation: none; }
            .promo-logo span { animation: none; }
        }
    </style>
</head>
<body>

    <div class="promo-wrapper">

        <!-- Video de fondo (si existe, se muestra; si no, fallback) -->
        <!--
          Para usar tu propio video, reemplaza "video.mp4" con la ruta de tu archivo.
          Si el video no se encuentra, se mostrará el fallback con gradiente animado.
        -->
        <video autoplay muted loop playsinline class="promo-video" poster="">
            <source src="video.mp4" type="video/mp4">
            <!-- Si no hay video, el navegador mostrará el fallback (gradiente) -->
        </video>
        <div class="promo-fallback"></div>

        <!-- Overlay -->
        <div class="promo-overlay"></div>

        <!-- Contenido -->
        <div class="promo-content">
            <div class="promo-logo"><span>W</span></div>
            <div class="promo-tagline">Laboratorio digital independiente</div>
            <h1 class="promo-title">
                Precisión <em>aplicada.</em>
            </h1>
            <p class="promo-desc">
                Evaluamos ideas, construimos marcas y desarrollamos productos digitales
                con método, investigación y sensibilidad estética.
            </p>
            <a href="contacto.html" class="promo-btn">
                Iniciar proyecto
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Scroll decorativo -->
        <div class="promo-scroll">
            <span>Desplaza</span>
            <div class="line"></div>
        </div>

    </div>

    <!-- Script ligero para interacción (opcional) -->
    <script>
        // Si el video no se puede cargar, ocultarlo para que se vea el fallback
        const video = document.querySelector('.promo-video');
        if (video) {
            video.addEventListener('error', function() {
                this.style.display = 'none';
            });
        }

        // Efecto de "parpadeo" suave en el logo (ya está en CSS)
        // Solo para asegurar que el enlace del botón funcione
        document.querySelector('.promo-btn')?.addEventListener('click', function(e) {
            // Si el enlace es interno y no existe, redirigir a index.html
            const href = this.getAttribute('href');
            if (href === 'contacto.html' && !window.location.href.includes('contacto')) {
                // Puedes cambiar la redirección si lo deseas
                // window.location.href = 'index.html';
                // Por ahora dejamos que el navegador intente cargar contacto.html
                // Si no existe, se puede cancelar el comportamiento y redirigir a index.html
                // Descomenta la siguiente línea si quieres forzar a index.html
                // e.preventDefault();
                // window.location.href = 'index.html';
            }
        });
    </script>

</body>
</html>
