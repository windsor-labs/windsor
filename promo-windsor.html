<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windsor — Precisión aplicada</title>
    <style>
        /* =========================================================
           WINDSOR PROMO — SPOT PUBLICITARIO (100% autónomo)
           Sin fuentes externas, sin imágenes, sin dependencias.
        ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0c;
            color: #ffffff;
        }

        .spot {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        /* Video de fondo (solo si existe el archivo) */
        .spot-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
        }

        /* Fallback: animación de gradiente si no hay video */
        .spot-fallback {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: linear-gradient(135deg, #0a0a0c 0%, #002244 40%, #0a0a0c 100%);
            background-size: 300% 300%;
            animation: gradiente 12s ease-in-out infinite alternate;
        }

        @keyframes gradiente {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Overlay oscuro */
        .spot-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(10, 10, 12, 0.5);
            backdrop-filter: blur(1px);
        }

        /* Contenido central */
        .spot-content {
            position: relative;
            z-index: 2;
            max-width: 820px;
            padding: 2rem;
            animation: fadeUp 1.6s ease-out;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logotipo W */
        .spot-logo {
            display: inline-block;
            font-size: 5rem;
            font-weight: 900;
            color: #006dff;
            letter-spacing: -0.06em;
            line-height: 1;
            margin-bottom: 0.25rem;
            text-shadow: 0 0 70px rgba(0, 109, 255, 0.3);
            animation: pulseLogo 3s ease-in-out infinite;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .spot-label {
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
            padding: 0.5rem 1.2rem;
            margin-bottom: 1rem;
        }

        .spot-headline {
            font-size: clamp(2.8rem, 12vw, 7rem);
            font-weight: 900;
            line-height: 0.88;
            letter-spacing: -0.03em;
            margin: 0.3rem 0 0.6rem;
        }

        .spot-headline em {
            display: block;
            color: #31e083;
            font-style: normal;
            text-decoration: underline;
            text-decoration-thickness: 0.08em;
            text-underline-offset: 0.1em;
        }

        .spot-desc {
            font-size: clamp(1rem, 1.6vw, 1.3rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            max-width: 540px;
            margin: 1.2rem auto 2.2rem;
            line-height: 1.6;
            letter-spacing: 0.02em;
        }

        /* Botón CTA — estilo Windsor */
        .spot-btn {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 15px 32px;
            background: #006dff;
            color: #ffffff;
            border: none;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: 0 0 30px rgba(0, 109, 255, 0.15);
        }

        .spot-btn:hover {
            background: #31e083;
            color: #0a0a0c;
            transform: scale(1.04);
            box-shadow: 0 0 50px rgba(49, 224, 131, 0.25);
        }

        .spot-btn .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
        }

        .spot-btn:hover .arrow {
            transform: translateX(5px);
        }

        /* Indicador inferior (estético) */
        .spot-footer {
            position: absolute;
            bottom: 2rem;
            left: 0;
            width: 100%;
            z-index: 2;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.15);
        }

        .spot-footer .line {
            width: 40px;
            height: 1px;
            margin: 8px auto 0;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .spot-logo { font-size: 3.6rem; }
            .spot-headline { font-size: 2.4rem; }
            .spot-desc { font-size: 0.95rem; }
            .spot-btn { padding: 13px 22px; font-size: 0.75rem; }
            .spot-footer { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .spot-fallback { animation: none; }
            .spot-content { animation: none; }
            .spot-logo { animation: none; }
        }
    </style>
</head>
<body>

    <div class="spot">

        <!-- VIDEO DE FONDO (opcional) -->
        <!--
          Para usar tu propio video, reemplaza "video.mp4" por la ruta de tu archivo.
          Si no existe, se mostrará el fallback con gradiente animado.
        -->
        <video autoplay muted loop playsinline class="spot-video" poster="">
            <source src="video.mp4" type="video/mp4">
            <!-- Si no hay video, el fallback se muestra debajo -->
        </video>

        <!-- Fallback visual (gradiente animado) -->
        <div class="spot-fallback"></div>

        <!-- Overlay oscuro -->
        <div class="spot-overlay"></div>

        <!-- Contenido principal -->
        <div class="spot-content">
            <div class="spot-logo">W</div>
            <div class="spot-label">Laboratorio digital independiente</div>
            <h1 class="spot-headline">
                Precisión <em>aplicada.</em>
            </h1>
            <p class="spot-desc">
                Evaluamos ideas, construimos marcas y desarrollamos productos digitales
                con método, investigación y sensibilidad estética.
            </p>
            <a href="index.html" class="spot-btn">
                Iniciar proyecto
                <span class="arrow">→</span>
            </a>
        </div>

        <!-- Pie decorativo -->
        <div class="spot-footer">
            <span>Windsor · 2026</span>
            <div class="line"></div>
        </div>

    </div>

    <!-- Script ligero (solo para ocultar video si falla) -->
    <script>
        (function() {
            const video = document.querySelector('.spot-video');
            if (video) {
                // Si el video no se carga, lo ocultamos para ver el fallback
                video.addEventListener('error', function() {
                    this.style.display = 'none';
                });
                // En algunos navegadores el evento 'error' no se dispara si el src está vacío
                // Por si acaso, comprobamos si el video tiene src válido
                const src = video.querySelector('source');
                if (src && !src.src) {
                    video.style.display = 'none';
                }
            }
        })();
    </script>

</body>
</html>
