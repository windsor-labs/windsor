<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windsor — It's Windser, not Windsor</title>
    <style>
        /* =========================================================
           WINDSOR CAMPAÑA — "IT'S WINDSER, NOT WINDSOR"
           Spot corto · Sin regaños · Mensaje directo
        ========================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0c;
            color: #ffffff;
        }

        .spot {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        .spot-noise {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.04;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        .spot-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: rgba(10, 10, 12, 0.08);
            transition: background 0.8s ease;
        }

        .slides {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            will-change: transform, opacity;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .slide-content {
            max-width: 800px;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        /* =========================================================
           ELEMENTOS ANIMABLES
        ========================================================== */
        .anim-item {
            opacity: 0;
            will-change: transform, opacity;
            transition-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .anim-item.visible {
            opacity: 1 !important;
            transform: translate(0, 0) scale(1) !important;
        }

        /* =========================================================
           TIPOGRAFÍA
        ========================================================== */
        .slide-big {
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.04em;
        }

        .slide-big .correct {
            color: #31e083;
        }

        .slide-big .wrong {
            color: #ff4444;
            text-decoration: line-through;
            text-decoration-thickness: 3px;
            opacity: 0.5;
        }

        .slide-sub {
            font-size: clamp(1rem, 2.5vw, 2rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            opacity: 0.4;
            margin-top: 0.3rem;
        }

        .slide-badge {
            font-size: clamp(0.6rem, 1.2vw, 0.9rem);
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 0.4rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
            opacity: 0.3;
        }

        /* Logo W */
        .slide-logo {
            font-size: clamp(8rem, 22vw, 14rem);
            font-weight: 900;
            color: #006dff;
            letter-spacing: -0.06em;
            line-height: 1;
            text-shadow: 0 0 80px rgba(0, 109, 255, 0.12);
        }

        /* =========================================================
           BARRA DE PROGRESO
        ========================================================== */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #006dff;
            transition: width 0.3s linear;
        }

        /* =========================================================
           RESPONSIVE
        ========================================================== */
        @media (max-width: 600px) {
            .slide-big {
                font-size: 3.2rem;
            }
            .slide-logo {
                font-size: 5rem;
            }
            .slide-sub {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .anim-item {
                transition-duration: 0.001ms !important;
                transition-delay: 0s !important;
            }
        }
    </style>
</head>
<body>

    <div class="spot">

        <div class="spot-noise"></div>
        <div class="spot-overlay" id="overlay"></div>

        <!-- =====================================================
             SLIDES — MENSAJE DIRECTO
        ====================================================== -->
        <div class="slides" id="slides">

            <!-- 0. LOGO + ESLOGAN -->
            <div class="slide slide-0" data-slide="0" style="background:#0a0a0c;">
                <div class="slide-content">
                    <div class="slide-logo anim-item" data-element="logo">W</div>
                    <div class="slide-badge anim-item" data-element="badge">It's Windser · not Windsor</div>
                </div>
            </div>

            <!-- 1. CORRECCIÓN (sin regaño) -->
            <div class="slide slide-1" data-slide="1" style="background:#0a0a0c;">
                <div class="slide-content">
                    <div class="slide-big anim-item" data-element="big">
                        It's <span class="wrong">Windsor</span>
                    </div>
                    <div class="slide-big anim-item" data-element="big2" style="margin-top:-0.1rem;">
                        It's <span class="correct">Windser</span>
                    </div>
                    <div class="slide-sub anim-item" data-element="sub">—</div>
                </div>
            </div>

            <!-- 2. REAFIRMACIÓN -->
            <div class="slide slide-2" data-slide="2" style="background:#0a0a0c;">
                <div class="slide-content">
                    <div class="slide-big anim-item" data-element="big" style="color:#31e083;">
                        Windser
                    </div>
                    <div class="slide-sub anim-item" data-element="sub" style="opacity:0.2; font-size:clamp(0.8rem,1.5vw,1.2rem);">not Windsor</div>
                </div>
            </div>

            <!-- 3. CIERRE -->
            <div class="slide slide-3" data-slide="3" style="background:#0a0a0c;">
                <div class="slide-content">
                    <div class="slide-logo anim-item" data-element="logo" style="font-size:clamp(6rem,16vw,10rem);">W</div>
                    <div class="slide-badge anim-item" data-element="badge">It's Windser</div>
                </div>
            </div>

        </div>

        <!-- =====================================================
             BARRA DE PROGRESO
        ====================================================== -->
        <div class="progress-bar">
            <div class="fill" id="progressFill"></div>
        </div>

    </div>

    <!-- =========================================================
         SCRIPT — BUCLE SIMPLE
    ========================================================== -->
    <script>
        (function() {
            'use strict';

            const SLIDES = document.querySelectorAll('.slide');
            const TOTAL = SLIDES.length;
            const PROGRESS_FILL = document.getElementById('progressFill');
            const OVERLAY = document.getElementById('overlay');

            let current = 0;
            let isTransitioning = false;
            let intervalId = null;

            // Efectos de entrada simples y variados
            const EFFECTS = [
                { transform: 'scale(0.85)', duration: 0.8 },
                { transform: 'translateY(40px)', duration: 0.9 },
                { transform: 'translateY(-40px)', duration: 0.9 },
                { transform: 'translateX(40px)', duration: 0.9 },
                { transform: 'translateX(-40px)', duration: 0.9 },
                { transform: 'scale(0.9) rotate(-3deg)', duration: 0.9 },
                { transform: 'scale(0.9) rotate(3deg)', duration: 0.9 },
            ];

            function getRandomEffect() {
                return EFFECTS[Math.floor(Math.random() * EFFECTS.length)];
            }

            function assignEffects() {
                document.querySelectorAll('.anim-item').forEach(el => {
                    const effect = getRandomEffect();
                    const delay = Math.random() * 0.3 + 0.05;
                    el.style.transition = '';
                    el.style.transform = '';
                    el.style.opacity = '';
                    el.style.transitionDelay = '';

                    el.style.transition =
                        `opacity ${effect.duration}s cubic-bezier(0.22,0.61,0.36,1), ` +
                        `transform ${effect.duration}s cubic-bezier(0.22,0.61,0.36,1)`;
                    el.style.transitionDelay = delay + 's';

                    el.dataset.effectTransform = effect.transform;

                    el.classList.remove('visible');
                    el.style.opacity = '0';
                    el.style.transform = effect.transform;
                });
            }

            function activateSlide(index) {
                const items = SLIDES[index].querySelectorAll('.anim-item');
                items.forEach(el => {
                    const delay = parseFloat(el.style.transitionDelay) || 0;
                    setTimeout(() => {
                        el.classList.add('visible');
                    }, (0.15 + delay) * 1000);
                });
            }

            function deactivateSlide(index) {
                const items = SLIDES[index].querySelectorAll('.anim-item');
                items.forEach(el => {
                    el.classList.remove('visible');
                    el.style.opacity = '0';
                    el.style.transform = el.dataset.effectTransform || 'scale(0.85)';
                });
            }

            function goToSlide(index) {
                if (isTransitioning || index === current) return;
                isTransitioning = true;

                deactivateSlide(current);
                SLIDES[current].classList.remove('active');

                current = index;
                SLIDES[current].classList.add('active');
                activateSlide(current);

                const progress = ((current + 1) / TOTAL) * 100;
                PROGRESS_FILL.style.width = progress + '%';

                const alpha = 0.04 + Math.random() * 0.08;
                OVERLAY.style.background = `rgba(10,10,12,${alpha})`;

                setTimeout(() => {
                    isTransitioning = false;
                }, 1000);
            }

            function nextSlide() {
                const next = (current + 1) % TOTAL;
                goToSlide(next);
                if (next === 0) {
                    setTimeout(() => {
                        assignEffects();
                        deactivateSlide(0);
                        setTimeout(() => {
                            activateSlide(0);
                        }, 80);
                    }, 500);
                }
            }

            function resetTimer() {
                if (intervalId) clearInterval(intervalId);
                const duration = 2400 + Math.random() * 500;
                intervalId = setInterval(nextSlide, duration);
            }

            function init() {
                assignEffects();
                SLIDES[0].classList.add('active');
                activateSlide(0);
                PROGRESS_FILL.style.width = (1 / TOTAL * 100) + '%';
                resetTimer();
                console.log('🎬 Windsor Campaign — "It\'s Windser, not Windsor"');
                console.log('   ' + TOTAL + ' slides · Mensaje directo');
            }

            // Interacción
            document.addEventListener('click', resetTimer);
            document.addEventListener('touchstart', resetTimer);
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    resetTimer();
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    resetTimer();
                    if (current > 0) goToSlide(current - 1);
                    else goToSlide(TOTAL - 1);
                }
            });

            init();

            window.spot = { next: nextSlide, goTo: goToSlide, current: () => current };

        })();
    </script>

</body>
</html>
